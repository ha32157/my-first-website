<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FitBuddy — AI Fitness Plan</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body class="page-shell">
  <main class="card hero-card">
    <div class="eyebrow">FITBUDDY · AI FITNESS</div>
    <h1>Build a plan that fits your goal.</h1>
    <p class="muted">Generate a personalized 7-day workout plan and a practical nutrition/recovery tip.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="post" action="/generate-workout" class="grid-form">
      <label>Name<input name="name" required minlength="2" maxlength="120" placeholder="Alex"></label>
      <label>User ID<input name="user_id" required pattern="[A-Za-z0-9_-]+" maxlength="80" placeholder="alex-001"></label>
      <label>Age<input type="number" name="age" min="13" max="100" required></label>
      <label>Weight (kg)<input type="number" name="weight_kg" min="20" max="350" step="0.1" required></label>
      <label>Fitness goal<select name="goal" required><option value="weight loss">Weight loss</option><option value="muscle gain">Muscle gain</option><option value="general wellness">General wellness</option><option value="flexibility">Flexibility</option></select></label>
      <label>Workout intensity<select name="intensity" required><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
      <button class="primary full" type="submit">Generate 7-day plan</button>
    </form>
    <div class="footer-links"><a href="/view-all-users">Admin dashboard</a><a href="/docs">API docs</a></div>
  </main>
</body>
</html>
